[package]
name = "polyloupe"
description = "A magnifying glass that translates text on the screen in place"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
log.workspace = true
polyloupe-ocr.workspace = true
polyloupe-translate.workspace = true
async-channel = "2"
dirs = "6"
env_logger = "0.11"
global-hotkey = "0.8"
gpui-kit = "0.7"
image = { version = "0.25", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = "0.26"
xcap = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-graphics = "0.3"
