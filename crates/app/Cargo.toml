[package]
name = "polyloupe"
description = "A magnifying glass that translates text on the screen in place"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
log.workspace = true
polyloupe-ocr.workspace = true
polyloupe-translate.workspace = true
async-channel = "2"
dirs = "6"
env_logger = "0.11"
global-hotkey = "0.8"
gpui-kit = "0.7"
image = { version = "0.25", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The ksni backend talks D-Bus directly, so Linux needs no GTK event loop.
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
xcap = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-graphics = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
xcb = "1.7"
